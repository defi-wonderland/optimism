<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>op-playground</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <aside id="nav">
      <div id="nav-brand">op-playground</div>
      <nav id="nav-links">
        <a href="#/" data-route="/" class="nav-link"><span class="nav-icon">⌂</span><span>Home</span></a>
        <a href="#/explorer" data-route="/explorer" class="nav-link"><span class="nav-icon">🔍</span><span>Explorer</span></a>
        <a href="#/tools" data-route="/tools" class="nav-link"><span class="nav-icon">⚙</span><span>Tools</span></a>
        <a href="#/consensus" data-route="/consensus" class="nav-link"><span class="nav-icon">⚖</span><span>Consensus</span></a>
        <a href="#/activity" data-route="/activity" class="nav-link"><span class="nav-icon">📋</span><span>Activity</span></a>
        <a href="#/network" data-route="/network" class="nav-link"><span class="nav-icon">ℹ</span><span>Network</span></a>
      </nav>
      <div id="nav-footer">
        <span id="nav-mode" class="muted">—</span>
        <span id="nav-uptime" class="muted">—</span>
      </div>
    </aside>

    <header id="topbar">
      <div id="topbar-title"></div>
      <div id="topbar-actions">
        <span id="topbar-drift" title="L2 unsafe head minus last L1 origin"></span>
        <span class="muted">Advance time</span>
        <button data-advance="60">+1m</button>
        <button data-advance="600">+10m</button>
        <button data-advance="1800">+30m</button>
        <button data-advance="3600">+1h</button>
      </div>
    </header>

    <main id="view"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
